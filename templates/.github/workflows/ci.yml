# CI skeleton. A PR runs only the jobs for the classes it touches; a push to
# main runs everything and opens an issue when it fails. There are no path
# filters on the workflow itself: every update to a PR starts a run, so the
# merge queue never waits on a run that was skipped.
#
# Replace each "echo" step with the project's real command. Keep the job
# names: the merge queue reads nothing from them, but people do.
#
# RUNS_ON is the runner label for every job here. ubuntu-latest for hosted
# runners; [self-hosted, windows] for a studio's own machines, which is
# what both existing studio projects use. The gh-only workflows (audit,
# board sync, state label, runner watch) stay hosted; they need no code.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

# RUN_SHELL is the shell every step here runs in. On hosted runners it is
# "bash". On a Windows self-hosted runner it must be Git's bash by its
# short path, because "bash" and "sh" on the runner's service account
# resolve to the WSL stub and every step fails:
#   'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'
# Keep it at the workflow level; a step-level shell cannot use expressions.
defaults:
  run:
    shell: RUN_SHELL

jobs:
  classify:
    runs-on: RUNS_ON
    outputs:
      classes: ${{ steps.classes.outputs.classes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            case "$base" in 0000000000000000000000000000000000000000) base="${{ github.sha }}~1" ;; esac
          fi
          classes=$(sh scripts/ci/classify.sh "$base" "${{ github.sha }}")
          echo "classes=$classes" >> "$GITHUB_OUTPUT"
          echo "Classes: $classes"

  app:
    needs: classify
    if: github.event_name == 'pull_request' && (contains(needs.classify.outputs.classes, 'app') || contains(needs.classify.outputs.classes, 'tests') || contains(needs.classify.outputs.classes, 'other'))
    runs-on: RUNS_ON
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the tests for this class
        # When this gets slow, shard it: add "strategy: matrix: shard: [1, 2, 3, 4]"
        # to this job and pass the shard to the runner, for example
        # "pytest --splits 4 --group ${{ matrix.shard }}" or "vitest --shard=N/4".
        run: echo "replace with the build and the app tests"

  build:
    # The production build, on every pull request that touches the app.
    # Agents never build inside a worktree (build output does not belong
    # there), so without this job nobody builds before merging; tests and
    # the type-check passed on a client bug that only the build and a page
    # load would show. Replace BUILD_COMMAND with the project's build, for
    # example "npm ci && npm run build" in the app's folder.
    needs: classify
    if: github.event_name == 'pull_request' && (contains(needs.classify.outputs.classes, 'app') || contains(needs.classify.outputs.classes, 'other'))
    runs-on: RUNS_ON
    steps:
      - uses: actions/checkout@v4
      - name: Fail when a client file hands process.env to anything whole
        run: sh scripts/ci/client-env-check.sh
      - name: The production build
        run: echo "replace with BUILD_COMMAND"

  data:
    needs: classify
    if: github.event_name == 'pull_request' && (contains(needs.classify.outputs.classes, 'data') || contains(needs.classify.outputs.classes, 'other'))
    runs-on: RUNS_ON
    steps:
      - uses: actions/checkout@v4
      - name: Check the data shape
        run: echo "replace with the seed and migration checks"

  docs:
    needs: classify
    if: github.event_name == 'pull_request' && (contains(needs.classify.outputs.classes, 'docs') || contains(needs.classify.outputs.classes, 'other'))
    runs-on: RUNS_ON
    steps:
      - uses: actions/checkout@v4
      - name: Check the docs
        run: echo "replace with the link and spelling checks"

  spec-check:
    # A change to src/ belongs to a spec: the pull request names it in its
    # body ("Spec: specs/<feature>") or, when the design changed, changes
    # the feature's folder. Naming is the normal case; a touch requirement
    # alone made every pull request append to spec.md.
    needs: classify
    if: github.event_name == 'pull_request' && (contains(needs.classify.outputs.classes, 'app') || contains(needs.classify.outputs.classes, 'other'))
    runs-on: RUNS_ON
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail when src/ changed without naming or changing its spec
        env:
          SPEC_TEXT: |
            ${{ github.event.pull_request.title }}
            ${{ github.event.pull_request.body }}
        run: sh scripts/ci/spec-check.sh "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"

  setup-check:
    # A change to a setup file must come with a line in SETUP.md.
    needs: classify
    if: github.event_name == 'pull_request'
    runs-on: RUNS_ON
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail when a setup file changed without SETUP.md
        run: sh scripts/ci/setup-check.sh "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"

  shared-check:
    # A fix to shared code gets its own pull request. Passes when the list
    # of shared paths is empty.
    needs: classify
    if: github.event_name == 'pull_request'
    runs-on: RUNS_ON
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail when shared code is changed together with other work
        run: sh scripts/ci/shared-check.sh "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"

  numbering-check:
    # Two numbered files with one number, or a task with a running number
    # instead of its issue number. Runs on every pull request, so a batch
    # that merged two migrations each called 0022 fails before main.
    if: github.event_name == 'pull_request'
    runs-on: RUNS_ON
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail on a reused number or a running task number
        run: sh scripts/ci/numbering-check.sh "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"

  line-endings:
    # Runs on every PR and every push: mixed endings make every diff a conflict.
    runs-on: RUNS_ON
    steps:
      - uses: actions/checkout@v4
      - name: Fail when a text file has CRLF endings
        run: sh scripts/ci/line-endings.sh

  status-page:
    # Runs on every PR and every push: the page must never go stale.
    runs-on: RUNS_ON
    steps:
      - uses: actions/checkout@v4
      - name: Fail when STATUS.md is stale
        run: sh status/check.sh

  ci-passed:
    # The one check branch protection requires. It waits for whichever class
    # jobs ran and reports once. A class job that was skipped on purpose
    # counts as fine; one that failed or was cancelled does not. Never put the
    # per-class jobs in branch protection: they are skipped when a change does
    # not need them, and a required check that never reports blocks the merge.
    name: CI passed
    needs: [classify, app, build, data, docs, spec-check, setup-check, shared-check, numbering-check, line-endings, status-page]
    if: always() && github.event_name == 'pull_request'
    runs-on: RUNS_ON
    steps:
      - name: Report once for every class check that ran
        run: |
          failed=0
          for pair in "classify:${{ needs.classify.result }}" "app:${{ needs.app.result }}" "build:${{ needs.build.result }}" "data:${{ needs.data.result }}" "docs:${{ needs.docs.result }}" "spec-check:${{ needs.spec-check.result }}" "setup-check:${{ needs.setup-check.result }}" "shared-check:${{ needs.shared-check.result }}" "numbering-check:${{ needs.numbering-check.result }}" "line-endings:${{ needs.line-endings.result }}" "status-page:${{ needs.status-page.result }}"; do
            job=${pair%%:*}
            result=${pair#*:}
            echo "$job: $result"
            case "$result" in failure|cancelled) failed=1 ;; esac
          done
          [ "$failed" -eq 0 ] || { echo "A class check failed; see the jobs above." >&2; exit 1; }
          echo "Every class check that ran is green."

  full:
    # The gate on main after every merge. The whole suite, nothing skipped.
    # On a personal account there are no runner groups and so no hosted
    # fallback: a job on self-hosted runners waits while they are offline,
    # and the hourly runner-watch workflow says so. An organization can put
    # the runners in a group with a hosted fallback instead.
    # On a self-hosted Windows runner, RUN_SHELL at the top of this file is
    # Git's bash by path; a PowerShell step says "shell: powershell" (not
    # pwsh, which a Store install hides from the service); never put an
    # expression in "shell:". Run scripts/ci/runner-doctor.sh first.
    if: github.event_name == 'push'
    runs-on: RUNS_ON
    steps:
      - uses: actions/checkout@v4
      - name: Run everything
        run: echo "replace with the full suite"

  report-red:
    needs: full
    if: always() && github.event_name == 'push' && needs.full.result == 'failure'
    runs-on: RUNS_ON
    steps:
      - name: Open an issue unless one is already open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A run superseded by a newer push to main is not a red main; only
          # the newest commit on main can open the issue.
          newest=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$newest" != "${{ github.sha }}" ]; then echo "A newer commit is on main; this run was superseded, not red."; exit 0; fi
          open=$(gh issue list --label ci-red --state open --json number -q length)
          if [ "$open" = "0" ]; then
            gh issue create \
              --title "main is red" \
              --label "ci-red,state:ready" \
              --body "The full run on main failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Fix it before merging anything else."
          else
            echo "A ci-red issue is already open; not opening another."
          fi

  report-green:
    # Main went green again: close the red-main issue with a comment, so it
    # does not outlive its cause and the audit stops mentioning it.
    needs: full
    if: always() && github.event_name == 'push' && needs.full.result == 'success'
    runs-on: RUNS_ON
    steps:
      - name: Close the red-main issue now that main is green
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for n in $(gh issue list --label ci-red --state open --json number -q '.[].number'); do
            gh issue close "$n" --comment "Main is green again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Closed by CI."
            echo "closed #$n"
          done
